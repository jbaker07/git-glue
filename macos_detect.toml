# macOS OpenBSM Detection System Configuration
# =============================================
#
# This configuration file controls the behavior of the macOS detection
# system including fact enrichment, playbook rules, and incident scoring.

# ==================== Global Settings ====================
[global]
enabled = true
log_level = "INFO"
segment_batch_size = 1000
max_concurrent_playbooks = 6

# ==================== Fact Enrichment ====================
[enrichment]

# Codesign validation settings
[enrichment.codesign]
enabled = true
cache_ttl_secs = 3600
timeout_ms = 500
apple_signed_trusted = true

# Rarity scoring
[enrichment.rarity]
enabled = true
db_lookback_days = 30
first_seen_host_weight = 0.3
first_seen_user_weight = 0.2
first_seen_tuple_weight = 0.15

# Entropy analysis
[enrichment.entropy]
enabled = true
min_file_size_bytes = 512
high_entropy_threshold = 85.0
suspicious_entropy_threshold = 50.0
suspicious_entropy_confidence_boost = 0.15

# ==================== Playbook A: LaunchD Persistence ====================
[playbook.A]
enabled = true
name = "LaunchD Persistence Detection"
description = "Detects suspicious LaunchDaemon/LaunchAgent installations"
ttl_hours = 72
dedupe_window_minutes = 10

[playbook.A.paths]
monitored = [
    "/Library/LaunchDaemons",
    "/Library/LaunchAgents",
    "/System/Library/LaunchDaemons",
    "/System/Library/LaunchAgents",
    "~/Library/LaunchAgents",
]

[playbook.A.scoring]
base_confidence = 0.80
first_seen_boost = 0.10
unsigned_plist_boost = 0.05
executable_from_suspicious_boost = 0.10
max_confidence = 0.95

[playbook.A.suspicious_destinations]
executables = [
    "/tmp",
    "/var/tmp",
    "/dev/shm",
    "/var/folders/**/C",
    "~/Library/Caches",
]

# ==================== Playbook B: Unsigned Exec + Network ====================
[playbook.B]
enabled = true
name = "Unsigned Executable with Network Activity"
description = "Detects unsigned binaries establishing network connections"
ttl_hours = 48
dedupe_window_minutes = 5

[playbook.B.network]
correlation_window_secs = 30
min_network_events = 1

[playbook.B.suspicious_ports]
ports = [
    4444, 5555, 6666, 7777, 8888, 9999,
    3389, 5900, 22, 23, 1433, 3306, 5432,
]

[playbook.B.scoring]
unsigned_base = 0.85
network_boost = 0.05
suspicious_port_boost = 0.05
first_seen_tuple_boost = 0.05
max_confidence = 0.95

[playbook.B.excluded_binaries]
patterns = [
    "/usr/bin/*",
    "/usr/libexec/*",
    "/bin/*",
    "/sbin/*",
    "/System/Library/*",
    "/Applications/*",
]

# ==================== Playbook C: Entropy Drop Detection ====================
[playbook.C]
enabled = true
name = "Entropy Drop Detection"
description = "Detects entropy drops suggesting data exfiltration or encryption"
ttl_hours = 24
dedupe_window_minutes = 15

[playbook.C.entropy]
baseline_lookback_secs = 3600
min_drop_percentage = 40.0
suspicious_threshold = 50.0
sample_window_secs = 300

[playbook.C.scoring]
drop_base = 0.75
high_drop_boost = 0.15
suspicious_entropy_boost = 0.10
sustained_drop_boost = 0.05
max_confidence = 0.90

[playbook.C.monitored_processes]
patterns = [
    "sshd",
    "curl",
    "wget",
    "openssl",
    "python",
    "perl",
    "ruby",
    "node",
]

# ==================== Playbook D: DYLD Injection ====================
[playbook.D]
enabled = true
name = "DYLD Environment Injection"
description = "Detects DYLD environment variable injection attacks"
ttl_hours = 72
dedupe_window_minutes = 10

[playbook.D.dyld_vars]
suspicious = [
    "DYLD_INSERT_LIBRARIES",
    "DYLD_FRAMEWORK_PATH",
    "DYLD_LIBRARY_PATH",
    "DYLD_FALLBACK_FRAMEWORK_PATH",
    "DYLD_FALLBACK_LIBRARY_PATH",
]

[playbook.D.scoring]
dyld_insert_base = 0.92
dyld_path_base = 0.80
apple_signed_target_boost = 0.05
first_seen_boost = 0.05
max_confidence = 0.98

[playbook.D.unsafe_library_paths]
patterns = [
    "/tmp/*",
    "/var/tmp/*",
    "/dev/shm/*",
    "~/Library/Caches/*",
    "/var/folders/**/C/*",
]

# ==================== Playbook E: Keychain Access ====================
[playbook.E]
enabled = true
name = "Suspicious Keychain Access"
description = "Detects unauthorized keychain access by unsigned binaries"
ttl_hours = 72
dedupe_window_minutes = 10

[playbook.E.keychain_paths]
monitored = [
    "~/Library/Keychains",
    "/Library/Keychains",
    "~/Library/Application Support/CrashReporter",
]

[playbook.E.scoring]
unsigned_access_base = 0.90
system_access_boost = 0.05
first_seen_boost = 0.05
from_user_writable_boost = 0.10
max_confidence = 0.96

[playbook.E.trusted_accessors]
paths = [
    "/Applications/",
    "/System/",
    "/Library/",
    "/usr/libexec/",
    "/opt/homebrew/",
]

# ==================== Playbook F: LOLBins/Stagers ====================
[playbook.F]
enabled = true
name = "LOLBin/Stager Detection"
description = "Detects execution of legitimate tools used as stagers"
ttl_hours = 48
dedupe_window_minutes = 5

[playbook.F.patterns]
curl_sh = "curl.*\\|.*sh"
curl_chmod = "curl.*\\|.*chmod"
osascript = "osascript.*tell.*keystroke"
download_exec = "curl.*-o.*&&.*chmod.*\\+x"

[playbook.F.lolbins]
suspicious = [
    "curl",
    "wget",
    "python",
    "perl",
    "ruby",
    "bash",
    "sh",
    "osascript",
    "awk",
    "sed",
    "find",
]

[playbook.F.scoring]
curl_sh_base = 0.90
curl_chmod_base = 0.85
osascript_base = 0.80
lolbin_base = 0.65
user_writable_boost = 0.10
unknown_executable_boost = 0.15
max_confidence = 0.92

[playbook.F.user_writable_dirs]
paths = [
    "/tmp",
    "/var/tmp",
    "/dev/shm",
    "~/Downloads",
    "~/Desktop",
    "~/Library/Caches",
]

# ==================== Incident Storage ====================
[incidents]
retention_days = 90
max_incidents = 1000000
cleanup_batch_size = 10000

# Incident aging and resolution
[incidents.lifecycle]
auto_resolve_hours = 168  # 7 days
escalate_if_repeated_hours = 24

# ==================== API Settings ====================
[api]
enabled = true
bind_host = "127.0.0.1"
port = 8765
request_timeout_secs = 30
max_request_size_bytes = 10485760  # 10 MB

[api.endpoints]
health = "/api/health"
incidents = "/api/incidents"
stats = "/api/stats"
facts = "/api/facts"
playbook_status = "/api/playbooks"

[api.rate_limiting]
enabled = false
requests_per_second = 100

# ==================== Logging and Debugging ====================
[logging]
level = "INFO"
format = "json"
output = "file"
file_path = "/var/log/macos-detect/detection.log"
max_file_size_mb = 100
max_backups = 10

[debugging]
verbose_fact_logging = false
dump_enrichments = false
trace_playbook_decisions = false
correlation_debug = false

# ==================== Performance Tuning ====================
[performance]
fact_cache_size = 10000
enrichment_parallelism = 4
playbook_parallelism = 6
batch_processing_max_latency_ms = 500

# Connection pooling
[performance.db]
connection_pool_size = 10
idle_timeout_secs = 300
max_lifetime_secs = 1800
