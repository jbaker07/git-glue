---
# playbooks/common/signal_high_conn_rate.yaml
# Detect high connection rate (worm, C2 beacon)

name: "High Connection Rate Detection"
description: "Alert when process opens many connections in short window (worm, C2)"
version: "1.0"

detection:
  signal:
    type: "high_conn_rate_burst"
    
  thresholds:
    high_rate_conn_count: 50
    window_secs: 60
    very_high_rate_conn_count: 200
    very_high_window_secs: 10

response:
  severity: "high"
  actions:
    - alert: true
    - isolate: true
    - block_network: false
    - log_connections: true

correlation_boost:
  - process_unsigned: 1.4
  - process_spawned_from_writable_location: 1.3
  - connecting_to_known_malware_ip: 2.5
  - combined_with_new_remote_ip: 1.5

tags:
  - "T1071"
  - "T1005"
  - "command_and_control"
  - "lateral_movement"
