[package]
name = "integration"
version = "0.1.0"
edition = "2021"
description = "Production-ready integration layer for EDR/SIEM ingest, mapping, correlation, and export"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client with async support
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full", "sync"] }
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# PDF generation
printpdf = "0.7"

# WebSocket for real-time sync
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Config
config = "0.14"

# Base64 encoding for auth
base64 = "0.22"

# Regex for pattern matching
regex = "1.10"

[dev-dependencies]
tokio-test = "0.4"
