[package]
name = "agent-linux"
version = "0.1.0"
edition = "2021"
description = "Linux capture agent using eBPF"

[lib]
name = "agent_linux"
path = "src/lib.rs"

[[bin]]
name = "agent-linux"
path = "src/main.rs"

[[bin]]
name = "capture_linux_rotating"
path = "src/bin/capture_linux_rotating.rs"

[dependencies]
edr-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
ctrlc = "3.4"

# Linux specific
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13.1", features = ["async_tokio"] }
aya-log = "0.2.1"
